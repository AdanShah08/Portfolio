<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Dark sleek background -->
  <rect width="100" height="100" rx="22" fill="#0b0b18" />

  <g stroke="url(#fav-grad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top handle -->
    <path d="M 38 25 L 38 20 C 38 18, 40 16, 43 16 L 57 16 C 60 16, 62 18, 62 20 L 62 25" stroke-width="3.5" />

    <!-- Main Briefcase Body -->
    <rect x="25" y="25" width="50" height="32" rx="5" stroke-width="3.5" />

    <!-- Flap line & clasps -->
    <path d="M 25 36 L 45 42 L 55 42 L 75 36" stroke-width="2.5" />
    <line x1="43" y1="41" x2="43" y2="44" stroke-width="2" />
    <line x1="57" y1="41" x2="57" y2="44" stroke-width="2" />

    <!-- Connecting node lines -->
    <line x1="28" y1="57" x2="20" y2="67" stroke-width="2.5" />
    <line x1="38" y1="57" x2="33" y2="73" stroke-width="2.5" />
    <line x1="50" y1="57" x2="50" y2="79" stroke-width="2.5" />
    <line x1="62" y1="57" x2="67" y2="73" stroke-width="2.5" />
    <line x1="72" y1="57" x2="80" y2="67" stroke-width="2.5" />

    <!-- Node circles -->
    <circle cx="20" cy="67" r="4" stroke-width="2.5" fill="#0b0b18" />
    <circle cx="33" cy="73" r="4" stroke-width="2.5" fill="#0b0b18" />
    <circle cx="50" cy="79" r="4.5" stroke-width="2.5" fill="#0b0b18" />
    <circle cx="67" cy="73" r="4" stroke-width="2.5" fill="#0b0b18" />
    <circle cx="80" cy="67" r="4" stroke-width="2.5" fill="#0b0b18" />
  </g>
</svg>